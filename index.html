    <script>
      // Suppress benign Vite HMR WebSocket errors in iframe proxy environments
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('closed without opened'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('closed without opened'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
